name: Collect jobs daily

"on":
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC every day
  workflow_dispatch:        # manual run button

concurrency:
  group: collect-jobs
  cancel-in-progress: false

permissions:
  contents: write           # needed to push data/latest_jobs.csv back to the repo

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests before collecting
        run: python -m pytest -q

      - name: Run collector
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python radar.py

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Damir Job Radar - collection summary"
            echo ""
            if [ -f data/collection_status.json ]; then
              echo '```json'
              cat data/collection_status.json
              echo '```'
              if grep -q '"no_sources_configured"' data/collection_status.json; then
                echo "::warning::No job sources configured - RELIEFWEB_APPNAME secret not set and no ATS boards in config.yaml. Existing feed preserved; add a source to start collecting."
              fi
            else
              echo "No collection_status.json was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated feed if it changed
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_jobs.csv data/collection_status.json
          if git diff --staged --quiet; then
            echo "Feed unchanged - nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh job feed $(date -u +%Y-%m-%d)"
          # checkout leaves a detached HEAD, so push HEAD to the branch explicitly
          git push origin "HEAD:${BRANCH}"
